plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stackupholdem.protrainer.testapp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.stackupholdem.protrainer.testapp'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName 'test-2026.09.18'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

name: Build Android test APK

on:
  push:
    branches:
      - chore/test-apk-build
    paths:
      - 'android-test/**'
      - 'stackup-holdem-teste-standalone.html'
      - '.github/workflows/build-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$SDK_ROOT" > android-test/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Copy standalone app into Android assets
        run: |
          mkdir -p android-test/app/src/main/assets
          cp stackup-holdem-teste-standalone.html android-test/app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle -p android-test assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release
          cp android-test/app/build/outputs/apk/debug/app-debug.apk release/StackUp-ProTrainer-TESTE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StackUp-ProTrainer-TESTE
          path: release/StackUp-ProTrainer-TESTE.apk
          if-no-files-found: error
          retention-days: 30

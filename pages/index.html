<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#05020a"><title>STACKUP HOLD'EM GRINDER</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#05020a}body{min-height:100dvh;display:flex;justify-content:center;font-family:Arial,sans-serif}.app{position:relative;width:min(100vw,562.5px);aspect-ratio:9/16;min-height:100dvh;background:#05020a url('./grinder-reference.webp') center top/100% 100% no-repeat;overflow:hidden}.hit{position:absolute;left:10.3%;width:79.5%;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}.hit:active{background:#fff1;border-radius:6vw}.bio{top:52.1%;height:8.8%}.wa{top:62.1%;height:8.4%}.google{top:71.7%;height:8.3%}.terms,.privacy{position:absolute;top:84.1%;height:3%;border:0;background:transparent}.terms{left:27%;width:18%}.privacy{left:48%;width:29%}.modal{position:fixed;inset:0;background:#000c;display:none;place-items:center;padding:24px;z-index:20}.modal.on{display:grid}.card{width:min(92vw,420px);background:#13091c;border:1px solid #9236d0;border-radius:22px;padding:24px;color:#fff;box-shadow:0 0 30px #8a20ff66}.card p{color:#d4cbd9;line-height:1.5}.card button{width:100%;min-height:50px;margin-top:10px;border-radius:14px;border:1px solid #a04de0;background:#341148;color:#fff;font-weight:800}@media(min-aspect-ratio:9/16){.app{height:100dvh;min-height:0;width:auto}}</style></head>
<body><main class="app" aria-label="STACKUP HOLD'EM GRINDER login"><button class="hit bio" aria-label="Entrar com Biometria" onclick="bio()"></button><button class="hit wa" aria-label="Entrar via WhatsApp" onclick="pending('WHATSAPP')"></button><button class="hit google" aria-label="Entrar com Google" onclick="pending('GOOGLE')"></button><button class="terms" aria-label="Termos de Uso" onclick="legal('TERMOS DE USO')"></button><button class="privacy" aria-label="Política de Privacidade" onclick="legal('POLÍTICA DE PRIVACIDADE')"></button></main>
<div class="modal" id="m" onclick="if(event.target===this)closeM()"><div class="card"><h2 id="mt"></h2><p id="mp"></p><div id="mx"></div><button onclick="closeM()">FECHAR</button></div></div>
<script>const m=document.getElementById('m'),mt=document.getElementById('mt'),mp=document.getElementById('mp'),mx=document.getElementById('mx');function show(t,p,x=''){mt.textContent=t;mp.textContent=p;mx.innerHTML=x;m.classList.add('on')}function closeM(){m.classList.remove('on')}function bio(){show('ATIVE O ACESSO BIOMÉTRICO','No primeiro acesso, entre com Google ou WhatsApp. Depois, ative a biometria deste dispositivo.','<button onclick="pending(\'GOOGLE\')">ENTRAR COM GOOGLE</button><button onclick="pending(\'WHATSAPP\')">ENTRAR VIA WHATSAPP</button>')}function pending(x){show(x,'PENDÊNCIA DE CONFIGURAÇÃO EXTERNA — autenticação real será ativada após configuração segura do provedor.')}function legal(t){show(t,'Conteúdo jurídico pendente de publicação.')}</script></body></html>

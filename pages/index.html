</style></head><body><main class="stage"><section class="panel"><div class="chip"><img class="logo-art" src="./grinder-logo.webp" alt="STACKUP HOLD&#39;EM GRINDER"></div><h1>BEM-VINDO</h1><div class="sub">TREINE. ENTENDA. EVOLUA NO POKER.</div><div class="divider">♠ ♥ ♦ <span class="r">♣</span></div><div class="actions"><button class="btn" onclick="bio()"><span class="ico bio">◉</span><span class="copy"><strong>Entrar com Biometria</strong><small>Acesso rápido e seguro</small></span><span class="arr">›</span></button><button class="btn" onclick="pending('WHATSAPP')"><span class="ico wa">◔</span><span class="copy"><strong>Entrar via WhatsApp</strong><small>Receba um código de acesso</small></span><span class="arr">›</span></button><button class="btn" onclick="pending('GOOGLE')"><span class="ico g">G</span><span class="copy"><strong>Entrar com Google</strong><small>Conta Google</small></span><span class="arr">›</span></button></div><div class="legal">Ao continuar, você concorda com nossos<br><a href="#" onclick="legal(event,'TERMOS DE USO')">Termos de Uso</a> &nbsp;e&nbsp; <a href="#" onclick="legal(event,'POLÍTICA DE PRIVACIDADE')">Política de Privacidade</a></div><i class="chips l"></i><i class="chips r"></i></section></main><div class="modal" id="m" onclick="if(event.target===this)closeM()"><div class="card"><h2 id="mt"></h2><p id="mp"></p><div id="mx"></div><button onclick="closeM()">FECHAR</button></div></div><script>const m=document.getElementById('m'),mt=document.getElementById('mt'),mp=document.getElementById('mp'),mx=document.getElementById('mx');function show(t,p,x=''){mt.textContent=t;mp.textContent=p;mx.innerHTML=x;m.classList.add('on')}function closeM(){m.classList.remove('on')}function bio(){show('ATIVE O ACESSO BIOMÉTRICO','No primeiro acesso, entre com Google ou WhatsApp. Depois, ative a biometria deste dispositivo.','<button onclick="pending(\'GOOGLE\')">ENTRAR COM GOOGLE</button><button onclick="pending(\'WHATSAPP\')">ENTRAR VIA WHATSAPP</button>')}function pending(x){show(x,'PENDÊNCIA DE CONFIGURAÇÃO EXTERNA — autenticação real será ativada após configuração segura do provedor.')}function legal(e,t){e.preventDefault();show(t,'Conteúdo jurídico pendente de publicação.')}</script></body></html>

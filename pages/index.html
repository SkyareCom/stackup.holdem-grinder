.actions{width:100%;display:grid;gap:13px}.btn{width:100%;min-height:70px;border-radius:18px;border:1px solid #8b5ba9;background:linear-gradient(135deg,rgba(82,29,111,.94),rgba(27,11,38,.98));color:#fff;text-align:left;padding:13px 18px;box-shadow:0 8px 25px #0008,inset 0 1px #ffffff2b;cursor:pointer}.btn:active{transform:scale(.98)}.btn strong{display:block;font-size:17px}.btn small{display:block;margin-top:5px;color:#cfc3d7;font-size:12px}.wa{border-color:#8b6339;background:linear-gradient(135deg,#39221a,#1a1012)}.google{border-color:#68517d;background:linear-gradient(135deg,#211529,#100b16)}

</style></head><body><main class="stage"><section class="panel">

</section></main>
<div class="modal" id="m" onclick="if(event.target===this)closeM()"><div class="card"><h2 id="mt"></h2><p id="mp"></p><div id="mx"></div><button onclick="closeM()">FECHAR</button></div></div>
<script>
const m=document.getElementById('m'),mt=document.getElementById('mt'),mp=document.getElementById('mp'),mx=document.getElementById('mx');
function show(t,p,x=''){mt.textContent=t;mp.textContent=p;mx.innerHTML=x;m.classList.add('on')}function closeM(){m.classList.remove('on')}
